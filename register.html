<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Creators</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .search {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        button,
        select {
            padding: 8px 14px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover,
        select:hover {
            background: #eee;
        }

        .profile {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .profile h2 {
            margin-top: 0;
        }

        .profile-tags {
            color: #666;
            font-size: 14px;
        }

        .profile-stats {
            color: #888;
            font-size: 13px;
            margin-top: 10px;
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;
        }

        #status {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <a class="back" href="index.html">← Home</a>

    <h1>Creators</h1>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search profiles..."
    >

  <div class="controls">

    <div id="tags"></div>

    <select id="sort" onchange="loadProfiles()">
        <option value="newest">Newest</option>
        <option value="views">Most viewed</option>
        <option value="posts">Most posts</option>
        <option value="name">Alphabetical</option>
    </select>

</div>
    <div id="status">
        Loading profiles...
    </div>

    <div id="profiles"></div>


    <script>

        const SUPABASE_URL = "https://qmypbudkzaaybarhcjhn.supabase.co";
        const SUPABASE_KEY = "sb_publishable_PIiIFOfS8JqGPV2s1-v-6w_fU7ZlN-2";

        const { createClient } = supabase;

        const db = createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        let currentTag = "all";

        async function loadTags() {

    const container = document.getElementById("tags");

    const { data, error } = await db
        .from("tags")
        .select("*")
        .order("name");

    if (error) {

        console.error(error);

        return;
    }

    container.innerHTML = "";

    const allButton = document.createElement("button");

    allButton.textContent = "All";

    allButton.onclick = function() {
        filterTag("all");
    };

    container.appendChild(allButton);


    data.forEach(tag => {

        const button = document.createElement("button");

        button.textContent = tag.name;

        button.onclick = function() {
            filterTag(tag.name.toLowerCase());
        };

        container.appendChild(button);

    });

}

        async function loadProfiles() {

            const container = document.getElementById("profiles");
            const status = document.getElementById("status");
            const sort = document.getElementById("sort").value;
            const search = document
                .getElementById("search")
                .value
                .toLowerCase();

            status.textContent = "Loading profiles...";
            container.innerHTML = "";


            let query = db
                .from("profiles")
                .select("*");


            if (sort === "views") {
                query = query.order("views", {
                    ascending: false
                });
            }

            else if (sort === "posts") {
                query = query.order("posts_count", {
                    ascending: false
                });
            }

            else if (sort === "name") {
                query = query.order("name", {
                    ascending: true
                });
            }

            else {
                query = query.order("created_at", {
                    ascending: false
                });
            }


            const { data, error } = await query;


            if (error) {

                console.error(error);

                status.textContent =
                    "Could not load profiles.";

                return;
            }


            let visibleProfiles = data;


            if (currentTag !== "all") {

                const { data: connections, error: tagError } =
                    await db
                        .from("profile_tags")
                        .select(`
                            profile_id,
                            tags!inner(name)
                        `)
                        .eq("tags.name", currentTag);


                if (tagError) {

                    console.error(tagError);

                    status.textContent =
                        "Could not load tags.";

                    return;
                }


                const ids = connections.map(
                    connection => connection.profile_id
                );


                visibleProfiles = visibleProfiles.filter(
                    profile => ids.includes(profile.id)
                );
            }


            if (search) {

                visibleProfiles = visibleProfiles.filter(
                    profile =>
                        profile.name.toLowerCase().includes(search) ||
                        (profile.description || "")
                            .toLowerCase()
                            .includes(search)
                );
            }


            if (visibleProfiles.length === 0) {

                status.textContent =
                    "No profiles found.";

                return;
            }


            status.textContent =
                visibleProfiles.length + " profiles";


            visibleProfiles.forEach(profile => {

                const element =
                    document.createElement("div");

                element.className = "profile";


                element.innerHTML = `

                    <h2>${profile.name}</h2>

                    <p>
                        ${profile.description || ""}
                    </p>

                    <div class="profile-stats">
                        ${profile.views} views ·
                        ${profile.posts_count} posts
                    </div>

                `;


                container.appendChild(element);

            });

        }


        function filterTag(tag) {

            currentTag = tag;

            loadTags();
            loadProfiles();

        }


        document
            .getElementById("search")
            .addEventListener("input", loadProfiles);


        loadProfiles();

    </script>

</body>
</html>
